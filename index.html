<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>オフトレカメラ Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        /* 画面表示部 */
        .screen-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #000000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* インカメラ表示時のみ左右反転（鏡像） */
        #liveVideo.mirror {
            transform: scaleX(-1);
        }

        #reviewVideo {
            display: none;
        }

        /* ステータス・カウントダウン表示 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 14px 18px;
            background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .status-badge {
            font-weight: 700;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 20px;
            letter-spacing: 1px;
            backdrop-filter: blur(8px);
        }

        .status-ready { color: #00e5ff; background: rgba(0, 229, 255, 0.15); border: 1px solid #00e5ff; }
        .status-waiting { color: #ffd600; background: rgba(255, 214, 0, 0.15); border: 1px solid #ffd600; }
        .status-recording { color: #ff3b30; background: rgba(255, 59, 48, 0.2); border: 1px solid #ff3b30; animation: pulse 1s infinite; }
        .status-review { color: #30d158; background: rgba(48, 209, 88, 0.15); border: 1px solid #30d158; }

        @keyframes pulse {
            50% { opacity: 0.5; }
        }

        .countdown-display {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        /* 操作パネル */
        .controls-panel {
            width: 100%;
            background-color: #1c1c1e;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .setting-card {
            background-color: #2c2c2e;
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .setting-label {
            font-size: 11px;
            color: #8e8e93;
            font-weight: 600;
        }

        .setting-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-adjust {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background-color: #3a3a3c;
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s, transform 0.1s;
        }

        .btn-adjust:active {
            background-color: #00e5ff;
            color: #000000;
            transform: scale(0.92);
        }

        .setting-value {
            font-size: 18px;
            font-weight: 700;
            min-width: 36px;
            text-align: center;
        }

        /* ボタン共通 */
        .btn-main, .btn-secondary, .btn-save {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-main:active, .btn-secondary:active, .btn-save:active {
            transform: scale(0.97);
        }

        .btn-start {
            background: linear-gradient(135deg, #00e5ff, #0066ff);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.4);
            font-size: 17px;
            padding: 16px;
        }

        .btn-cancel {
            background-color: #ff3b30;
            color: #ffffff;
            font-size: 17px;
            padding: 16px;
        }

        .btn-secondary {
            background-color: #2c2c2e;
            color: #00e5ff;
            border: 1px solid #3a3a3c;
        }

        .btn-save {
            background-color: #30d158;
            color: #ffffff;
            font-size: 16px;
            padding: 14px;
            display: none; /* REVIEW時のみ表示 */
            box-shadow: 0 4px 15px rgba(48, 209, 88, 0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- カメラ / リプレイ表示領域 -->
    <div class="screen-wrapper">
        <div class="overlay">
            <div id="statusBadge" class="status-badge status-ready">READY</div>
            <div id="countdown" class="countdown-display"></div>
        </div>
        <video id="liveVideo" autoplay playsinline muted></video>
        <video id="reviewVideo" playsinline controls></video>
    </div>

    <!-- コントロール部 -->
    <div class="controls-panel">
        <!-- 秒数設定 -->
        <div class="settings-grid">
            <div class="setting-card">
                <span class="setting-label">準備ディレイ</span>
                <div class="setting-control">
                    <button class="btn-adjust" onclick="adjustDelay(-1)">-</button>
                    <span id="delayVal" class="setting-value">3秒</span>
                    <button class="btn-adjust" onclick="adjustDelay(1)">+</button>
                </div>
            </div>
            <div class="setting-card">
                <span class="setting-label">録画時間</span>
                <div class="setting-control">
                    <button class="btn-adjust" onclick="adjustRecord(-1)">-</button>
                    <span id="recordVal" class="setting-value">10秒</span>
                    <button class="btn-adjust" onclick="adjustRecord(1)">+</button>
                </div>
            </div>
        </div>

        <!-- カメラ切替ボタン -->
        <button id="camSwitchBtn" class="btn-secondary" onclick="toggleCamera()">
            🔄 カメラ切替 (現在: アウトカメラ)
        </button>

        <!-- 動画保存ボタン（撮影後のみ出現） -->
        <button id="saveBtn" class="btn-save" onclick="saveVideo()">
            💾 動画を保存 (カメラロールへ)
        </button>

        <!-- スタート/キャンセル ボタン -->
        <button id="mainBtn" class="btn-main btn-start" onclick="handleMainAction()">
            ▶ 撮影スタート
        </button>
    </div>
</div>

<script>
    let delaySeconds = 3;
    let recordSeconds = 10;
    let currentFacingMode = "environment"; // 初期表示を「environment」(外カメラ) に設定
    
    let currentState = "READY"; // READY, WAITING, RECORDING, REVIEW
    let mediaRecorder = null;
    let recordedChunks = [];
    let timerInterval = null;

    const liveVideo = document.getElementById('liveVideo');
    const reviewVideo = document.getElementById('reviewVideo');
    const statusBadge = document.getElementById('statusBadge');
    const countdownEl = document.getElementById('countdown');
    const mainBtn = document.getElementById('mainBtn');
    const camSwitchBtn = document.getElementById('camSwitchBtn');
    const saveBtn = document.getElementById('saveBtn');

    // カメラ起動・切り替え処理
    async function initCamera() {
        if (liveVideo.srcObject) {
            liveVideo.srcObject.getTracks().forEach(track => track.stop());
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });
            liveVideo.srcObject = stream;

            if (currentFacingMode === "user") {
                liveVideo.classList.add('mirror');
                camSwitchBtn.innerText = "🔄 カメラ切替 (現在: インカメラ)";
            } else {
                liveVideo.classList.remove('mirror');
                camSwitchBtn.innerText = "🔄 カメラ切替 (現在: アウトカメラ)";
            }
        } catch (err) {
            alert("カメラの起動に失敗しました: " + err.message);
        }
    }

    // カメラ切り替え（イン ↔ アウト）
    async function toggleCamera() {
        if (currentState !== "READY" && currentState !== "REVIEW") return;
        currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
        await initCamera();
    }

    // 秒数調整
    function adjustDelay(delta) {
        if (currentState !== "READY" && currentState !== "REVIEW") return;
        delaySeconds = Math.max(0, delaySeconds + delta);
        document.getElementById('delayVal').innerText = delaySeconds + "秒";
    }

    function adjustRecord(delta) {
        if (currentState !== "READY" && currentState !== "REVIEW") return;
        recordSeconds = Math.max(1, recordSeconds + delta);
        document.getElementById('recordVal').innerText = recordSeconds + "秒";
    }

    // ボタンタップ時の処理
    function handleMainAction() {
        if (currentState === "READY" || currentState === "REVIEW") {
            startProcess();
        } else {
            resetToReady();
        }
    }

    // 一連の撮影プロセス開始
    function startProcess() {
        reviewVideo.pause();
        reviewVideo.style.display = "none";
        liveVideo.style.display = "block";

        if (delaySeconds > 0) {
            setState("WAITING");
            let count = delaySeconds;
            countdownEl.innerText = count + "s";

            timerInterval = setInterval(() => {
                count--;
                if (count <= 0) {
                    clearInterval(timerInterval);
                    countdownEl.innerText = "";
                    startRecording();
                } else {
                    countdownEl.innerText = count + "s";
                }
            }, 1000);
        } else {
            startRecording();
        }
    }

    // 録画開始
    function startRecording() {
        setState("RECORDING");
        recordedChunks = [];
        
        const stream = liveVideo.srcObject;
        if (!stream) return;

        let mimeType = 'video/mp4';
        if (!MediaRecorder.isTypeSupported(mimeType)) {
            mimeType = 'video/webm;codecs=vp9';
            if (!MediaRecorder.isTypeSupported(mimeType)) {
                mimeType = 'video/webm';
            }
        }

        mediaRecorder = new MediaRecorder(stream, { mimeType });

        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
            const videoURL = URL.createObjectURL(blob);
            
            reviewVideo.src = videoURL;
            liveVideo.style.display = "none";
            reviewVideo.style.display = "block";
            
            setState("REVIEW");
        };

        mediaRecorder.start();

        let count = recordSeconds;
        countdownEl.innerText = count + "s";

        timerInterval = setInterval(() => {
            count--;
            if (count <= 0) {
                clearInterval(timerInterval);
                countdownEl.innerText = "";
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                }
            } else {
                countdownEl.innerText = count + "s";
            }
        }, 1000);
    }

    // 動画保存・カメラロールへの書き出し処理
    async function saveVideo() {
        if (!recordedChunks || recordedChunks.length === 0) return;

        const mimeType = mediaRecorder ? mediaRecorder.mimeType : 'video/mp4';
        const isMp4 = mimeType.includes('mp4');
        const ext = isMp4 ? 'mp4' : 'webm';
        
        const blob = new Blob(recordedChunks, { type: mimeType });
        const fileName = `off_training_${Date.now()}.${ext}`;

        const file = new File([blob], fileName, { type: mimeType });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
                await navigator.share({
                    files: [file],
                    title: 'オフトレ動画',
                    text: '撮影したフォーム確認動画です'
                });
                return;
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error('保存処理エラー:', err);
                } else {
                    return;
                }
            }
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }, 100);
    }

    // UI状態切替
    function setState(state) {
        currentState = state;
        statusBadge.className = "status-badge";

        if (state === "READY") {
            statusBadge.classList.add("status-ready");
            statusBadge.innerText = "READY";
            mainBtn.className = "btn-main btn-start";
            mainBtn.innerText = "▶ 撮影スタート";
            countdownEl.innerText = "";
            camSwitchBtn.disabled = false;
            camSwitchBtn.style.opacity = "1";
            saveBtn.style.display = "none";
        } else if (state === "WAITING") {
            statusBadge.classList.add("status-waiting");
            statusBadge.innerText = "COUNTDOWN";
            mainBtn.className = "btn-main btn-cancel";
            mainBtn.innerText = "■ キャンセル";
            camSwitchBtn.disabled = true;
            camSwitchBtn.style.opacity = "0.5";
            saveBtn.style.display = "none";
        } else if (state === "RECORDING") {
            statusBadge.classList.add("status-recording");
            statusBadge.innerText = "● REC";
            mainBtn.className = "btn-main btn-cancel";
            mainBtn.innerText = "■ 停止";
            camSwitchBtn.disabled = true;
            camSwitchBtn.style.opacity = "0.5";
            saveBtn.style.display = "none";
        } else if (state === "REVIEW") {
            statusBadge.classList.add("status-review");
            statusBadge.innerText = "REVIEW";
            mainBtn.className = "btn-main btn-start";
            mainBtn.innerText = "🔄 もう一度撮影";
            countdownEl.innerText = "";
            camSwitchBtn.disabled = false;
            camSwitchBtn.style.opacity = "1";
            saveBtn.style.display = "flex";
        }
    }

    // キャンセル・リセット
    function resetToReady() {
        if (timerInterval) clearInterval(timerInterval);
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
        }
        reviewVideo.pause();
        reviewVideo.style.display = "none";
        liveVideo.style.display = "block";
        setState("READY");
    }

    // 初期化
    window.addEventListener('DOMContentLoaded', initCamera);
</script>

</body>
</html>
