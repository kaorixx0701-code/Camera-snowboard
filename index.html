<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stylish Video Replay Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .player-card {
      position: relative;
      width: 90%;
      max-width: 720px;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    /* 中央リプレイオーバーレイボタン */
    .overlay-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(8px);
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
    }
    .overlay-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    .overlay-btn:hover {
      transform: translate(-50%, -50%) scale(1.1);
      background: rgba(99, 102, 241, 0.85);
      box-shadow: 0 0 40px rgba(99, 102, 241, 0.7);
    }
    /* コントロールバー */
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
    }
    .btn {
      background: none;
      border: none;
      color: #e2e8f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      transition: background 0.2s, color 0.2s;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
    .progress-container {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      border-radius: 3px;
      transition: width 0.1s linear;
    }
    .time-display {
      color: #94a3b8;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="player-card">
    <div class="video-wrapper">
      <video id="videoPlayer" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"></video>
      <button class="overlay-btn" id="overlayBtn" title="もう一度再生">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6"></path>
          <path d="M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
        </svg>
      </button>
    </div>
    <div class="controls">
      <button class="btn" id="playBtn" title="再生/一時停止">
        <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5,3 19,12 5,21"></polygon>
        </svg>
      </button>
      <button class="btn" id="replayBtn" title="最初からリプレイ">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 4v6h6"></path>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
      </button>
      <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
    </div>
  </div>

  <script>
    const video = document.getElementById('videoPlayer');
    const playBtn = document.getElementById('playBtn');
    const replayBtn = document.getElementById('replayBtn');
    const overlayBtn = document.getElementById('overlayBtn');
    const playIcon = document.getElementById('playIcon');
    const progressBar = document.getElementById('progressBar');
    const progressContainer = document.getElementById('progressContainer');
    const timeDisplay = document.getElementById('timeDisplay');

    const PLAY_SVG = '<polygon points="5,3 19,12 5,21"></polygon>';
    const PAUSE_SVG = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';

    // リプレイ処理（再生位置クリア＋Promise対応）
    function replay() {
      video.currentTime = 0;
      video.play().then(() => {
        updatePlayState(true);
        overlayBtn.classList.remove('visible');
      }).catch(err => {
        console.error('再生失敗:', err);
      });
    }

    function togglePlay() {
      if (video.ended) {
        replay();
        return;
      }
      if (video.paused) {
        video.play().then(() => updatePlayState(true)).catch(console.error);
      } else {
        video.pause();
        updatePlayState(false);
      }
    }

    function updatePlayState(isPlaying) {
      playIcon.innerHTML = isPlaying ? PAUSE_SVG : PLAY_SVG;
      if (isPlaying) overlayBtn.classList.remove('visible');
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    playBtn.addEventListener('click', togglePlay);
    replayBtn.addEventListener('click', replay);
    overlayBtn.addEventListener('click', replay);

    video.addEventListener('timeupdate', () => {
      if (video.duration) {
        const pct = (video.currentTime / video.duration) * 100;
        progressBar.style.width = `${pct}%`;
        timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
      }
    });

    // 動画終了時イベントの監視
    video.addEventListener('ended', () => {
      updatePlayState(false);
      overlayBtn.classList.add('visible');
    });

    progressContainer.addEventListener('click', (e) => {
      const rect = progressContainer.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      video.currentTime = pos * video.duration;
    });
  </script>
</body>
</html>
